<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="src/output.css" />
</head>
<body class="low-h-screen bg-[url('https://images.unsplash.com/photo-1501630834273-4b5604d2ee31')] bg-cover bg-center text-black-400">
  <!-- <img src="Public/sky.jpg" alt="back img"> -->
  <main class="High-w-6xl mx-auto px-6 py-8">

    <!-- Header -->
   <header class="mb-10">
  <h1 class="text-base tracking-[0.3em] opacity-80 font-medium">
    WEATHER APP
  </h1>
</header>



   <section class="flex justify-center mb-10">
  <div class="flex w-full max-w-xl">
    
    <div class="relative w-full max-w-xl mx-auto">
  <input
    type="text"
    id="Scity"
    placeholder="Search city"
    class="w-full px-6 py-3  bg-gray-300 text-gray-900 placeholder-gray-400 shadow-md focus:outline-none focus:ring-2 focus:ring-pink-300"
  />

  <ul
    id="citySuggestions"
    class="absolute left-0 right-0 mt-1 bg-white rounded-xl shadow-lg hidden z-50 overflow-hidden"
  ></ul>
</div>

    <button
      id="searchBtn"
      class="px-6 py-3 rounded-r-full  bg-gray-300 text-white font-medium shadow-md hover:bg-fuchsia-100 hover:text-black transition"
    >
      Search
    </button>

  </div>
</section>

    <!-- Location Info -->
    <section class="mb-10">
      <h2  class="text-4xl font-semibold city">New York,US</h2>
      <!-- <p class="opacity-90">Wednesday, 1 April</p> -->
      <p class="date text-sm opacity-80"></p>
    </section>

    <!-- Current Weather -->
    <section class="grid md:grid-cols-2 gap-8 mb-12">

      <!-- Temperature -->
      <div class="flex items-center gap-6">
       
        
          <img src="" id="weatherIcon" class="text-7xl" alt="icon">
          <div>
          <p class=" temp text-7xl font-bold">5°</p>
          <div id="weatherAlert" class="hidden"></div>
          <button
  id="unitToggle"
  class="mt-2 px-4 py-1 text-sm rounded-full bg-white/30 backdrop-blur-md hover:bg-white/50 transition"
>
  °F
</button>
          <p class=" condition opacity-90">Overcast clouds</p>
        </div> 
        <p id="errorBox" class="hidden px-4 py-1 text-sm rounded-full text-red-700 border-0 bg-white/30 backdrop-blur-md hover:bg-white/50 mt-3 text-center"></p>
      </div>
       
      <!-- Details Card -->
      <div class="bg-white/20 backdrop-blur-md rounded-2xl p-6 grid grid-cols-3 gap-4 text-center">
        <div>
          <p class="text-sm opacity-80">High</p>
          <p class=" high text-xl font-semibold">6°</p>
        </div>
        <div>
          <p class="text-sm opacity-80">Wind</p>
          <p class=" wind text-xl font-semibold">3.1 mph</p>
        </div>
        <div>
          <p class="text-sm opacity-80">Sunrise</p>
          <p class=" sunrise text-xl font-semibold">6:40</p>
        </div>
        <div>
          <p class="text-sm opacity-80">Visibility</p>
          <p class=" visibility text-xl font-semibold"></p>
        </div>
        <div>
          <p class="text-sm opacity-80">Humidity</p>
          <p class=" humidity text-xl font-semibold">70%</p>
        </div>
        <div>
          <p class="text-sm opacity-80">Sunset</p>
          <p class="sunset text-xl font-semibold"></p>
        </div>
      </div>

    </section>

    <!-- Forecast -->
    <section>
    
      

        <!-- Forecast Card -->
       <section class="max-w-5xl mx-auto mt-12">
  <h2 class="text-xl mb-4 font-semibold text-center ">5-Day Forecast</h2>

  <div
    id="forecast"
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4"
  ></div>
</section>

    


</section>
<div
  id="weather-bg"
  class="fixed inset-0 -z-10 bg-cover bg-center transition-all duration-700"
></div>
<!-- to set dynamic background -->

  </main>

  <script src="script.js"></script>
</body>
</html>
